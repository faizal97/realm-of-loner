# Checks on every pull request and every push to main and the short work branches (#88). The fast job runs the data, lore,
# name and symbol checks and the unit tests in a couple of minutes. The full build (#92) runs every gate of python3 build.py
# --dev and the pass/fail sims it doesn't run (tools/ci-sim-gates.txt, seed 0), split in three jobs at once (build, and gates
# for effects and for prof, social, brawl), and is skipped when only docs or notes changed (#88). On main, once all pass,
# publish-dev puts that dev build on the site's /dev/ page: https://faizal97.github.io/realm-of-loner/dev/
# Security: pull_request (never pull_request_target), read-only, no secrets, actions pinned to a commit, so a fork's
# code can't reach anything. Only publish-dev may write, only on main, and only gh-pages' dev/ folder.
name: checks
on:
  pull_request:
  push: # main, and the short work branches before they merge (trunk plus short branches); never gh-pages (the built web pages)
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  # a newer push cancels a branch's older run, but never on main: there each run publishes its own dev build, and a
  # docs-only push (which skips the build) must not cancel a code push's run and leave /dev/ without that code
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Game data
        run: node tools/validate.js
      - name: Lore (spoilers, names, typos) and its self-test
        run: |
          node tools/lorekeeper.js
          node tools/lorekeeper.js --selftest
      - name: No old-world names in player text
        run: node tools/ipcheck.js --brief --enforce
      - name: Every symbol can be drawn
        run: node tools/symcheck.js
      - name: Unit tests
        run: node --test test/*.test.js
      - name: Discord announcer (dry runs only, nothing is posted)
        run: node tools/announce_discord.test.js
      # a reminder, never a failure: the pull request template asks for "Refs #N" (or a contributor's Fixes/Closes #N) or what and why
      - name: Pull request description
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          what=$(printf '%s' "$BODY" | sed -E -n '/What and why/,/^(Refs|Fixes) #/p' | grep -v -e 'What and why' -e '^Refs #' -e '^Fixes #' -e '^[[:space:]]*$' | head -1)
          if ! printf '%s' "$BODY" | grep -Eiq '(refs|fixes|closes|resolves) #[0-9]+' && [ -z "$what" ]; then
            echo "::warning title=Pull request description::Please link the issue (Refs #N) or say what and why in the description. Thanks!"
          fi
  # whether the full build is needed (#88): a change only to notes, docs, the issue and PR templates, the README or
  # CLAUDE.md can't move a gate, so it skips the build; anything else (code, data, sims, tools, this workflow) runs it all
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event_name == 'pull_request' }}
        run: |
          full=true
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if [ "$PR" = true ]; then files=$(git diff --name-only "$BASE...$HEAD_SHA"); else files=$(git diff --name-only "$BASE" "$HEAD_SHA"); fi
            printf 'changed:\n%s\n' "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -vqE '^(notes/|docs/|art/promo/|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$|README\.md$|CLAUDE\.md$)'; then full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"; echo "full build needed: $full"
  # the full build in three jobs at once (#88): this one builds the page with every gate but the three slow ones, which
  # the gates job runs beside it exactly as build.py would (about 13 minutes in all, was 24)
  build:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # the sims follow the local clock (who is online, the week), and every gate was measured and every release built
      # in Faizal's time zone: the same here, or a gate can pass on his machine and fail on the runner (auction did)
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: The build and its gates (a dev build, #92), but effects, prof, social and brawl (the gates job runs those)
        run: python3 build.py --dev --skip=effects,prof,social,brawl
      - name: The pass/fail sims the build doesn't run (tools/ci-sim-gates.txt, seed 0)
        run: |
          for s in $(grep -v '^#' tools/ci-sim-gates.txt); do
            echo "::group::$s"; start=$(date +%s)
            SEED=0 node -r ./sim/_seed.js "sim/$s.js" || { echo "::error title=Sim gate::sim/$s.js failed at seed 0"; exit 1; }
            echo "::endgroup::$s: $(( $(date +%s) - start ))s"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dev-build
          path: dist-dev/
          retention-days: 3
  gates:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: gates (${{ matrix.sims }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sims: ['effects', 'prof social brawl']
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: The gates, as build.py runs them
        env:
          SIMS: ${{ matrix.sims }}
        run: |
          for s in $SIMS; do
            args=""; [ "$s" = brawl ] && args=48 # build.py runs brawl with 48
            echo "::group::$s"; start=$(date +%s)
            node "sim/$s.js" $args || { echo "::error title=Gate::sim/$s.js failed"; exit 1; }
            echo "::endgroup::$s: $(( $(date +%s) - start ))s"
          done
  # the dev page (#92): main only, after every check passes (skipped with the build when only docs changed); the one
  # job that writes, and only gh-pages' dev/ folder (never the main page or /beta/)
  publish-dev:
    needs: [fast, build, gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-build
          path: dev-build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
      - name: Put the dev build on /dev/
        working-directory: site
        run: |
          test -f ../dev-build/index.html
          grep -q 'window.AZ_DEV=' ../dev-build/index.html # never publish a live build to /dev/
          rm -rf dev && mkdir dev && cp -R ../dev-build/. dev/
          touch .nojekyll
          git add -A dev .nojekyll
          if git diff --cached --quiet; then echo "dev page already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Dev build ${GITHUB_SHA::7} (/dev/)"
          git push -q origin gh-pages
